name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/mobile-game-concept-yj5t0a
    paths-ignore:
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate web assets
        run: |
          set -euo pipefail

          for file in js/*.js sw.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));

          const files = fs.readdirSync('js').filter((name) => name.endsWith('.js'));
          const missing = [];
          const importPattern = /(?:from\s+)?["'](\.\/[A-Za-z0-9_.-]+\.js)(?:\?[^"']*)?["']/g;

          for (const name of files) {
            const source = fs.readFileSync(path.join('js', name), 'utf8');
            for (const match of source.matchAll(importPattern)) {
              const target = path.resolve('js', match[1]);
              if (!fs.existsSync(target)) missing.push(`${name} -> ${match[1]}`);
            }
          }

          if (missing.length) {
            console.error('Missing module imports:\n' + missing.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble web assets
        run: |
          mkdir -p www
          cp -r index.html css js icon.svg manifest.webmanifest sw.js www/

      - name: Init Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "io.github.nanitenshi.neonalley",
            "appName": "NEON ALLEY",
            "webDir": "www",
            "android": {
              "backgroundColor": "#05070a"
            }
          }
          CFG
          npx cap add android

      - name: Generate app icon and splash from icon.svg
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 --background-color '#05070a' icon.svg -o assets/icon.png
          rsvg-convert -w 2732 -h 2732 --background-color '#05070a' icon.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npm install @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#05070a' --iconBackgroundColorDark '#05070a'

      - name: Align Kotlin stdlib versions
        run: |
          # Fix for duplicate kotlin.* classes: BOM aligns stdlib variants.
          cat >> android/app/build.gradle << 'EOF'

          dependencies {
              implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
          }
          EOF

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk neon-alley.apk

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "NEON ALLEY — Android APK"
          prerelease: true
          body: |
            Automatisch gebaute APK vom neuesten Spielstand (Debug-signiert).

            **Installation auf dem Handy:**
            1. `neon-alley.apk` unten herunterladen
            2. Datei öffnen — Android fragt nach Erlaubnis für "Unbekannte Quellen" → erlauben
            3. Installieren, fertig

            Hinweis: Die Web-Version (nanitenshi.github.io/netrunner) aktualisiert sich
            automatisch — die APK muss bei Updates neu heruntergeladen werden.
          files: neon-alley.apk
