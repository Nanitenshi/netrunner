name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mobile-game-concept-yj5t0a
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate web build
        run: |
          set -euo pipefail

          for file in js/*.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));

          const files = fs.readdirSync('js').filter((name) => name.endsWith('.js'));
          const missing = [];
          const importPattern = /(?:from\s+)?["'](\.\/[A-Za-z0-9_.-]+\.js)(?:\?[^"']*)?["']/g;

          for (const name of files) {
            const source = fs.readFileSync(path.join('js', name), 'utf8');
            for (const match of source.matchAll(importPattern)) {
              const target = path.resolve('js', match[1]);
              if (!fs.existsSync(target)) missing.push(`${name} -> ${match[1]}`);
            }
          }

          if (missing.length) {
            console.error('Missing module imports:\n' + missing.join('\n'));
            process.exit(1);
          }
          NODE

          test -f index.html
          test -f css/style.css
          test -f icon.svg

      - name: Cache-bust CSS and module graph
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          V="${BUILD_VERSION:0:8}"
          export V

          python3 <<'PY'
          import os
          import pathlib
          import re

          version = os.environ['V']

          index = pathlib.Path('index.html')
          text = index.read_text(encoding='utf-8')
          for asset in ('css/style.css', 'js/core.js', 'manifest.webmanifest'):
              text = re.sub(
                  rf'(["\']){re.escape(asset)}(?:\?[^"\']*)?\1',
                  lambda m, a=asset: f'{m.group(1)}{a}?v={version}{m.group(1)}',
                  text,
              )
          index.write_text(text, encoding='utf-8')

          module_pattern = re.compile(r'(["\'])(\./[A-Za-z0-9_.-]+\.js)(?:\?[^"\']*)?\1')
          for file in pathlib.Path('js').glob('*.js'):
              source = file.read_text(encoding='utf-8')
              source = module_pattern.sub(
                  lambda m: f'{m.group(1)}{m.group(2)}?v={version}{m.group(1)}',
                  source,
              )
              file.write_text(source, encoding='utf-8')
          PY

          grep -E "style\.css|core\.js|manifest\.webmanifest" index.html
          grep -h "^import" js/core.js js/builds.js js/enhancements.js

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".github"
